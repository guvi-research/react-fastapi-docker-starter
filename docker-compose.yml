services:
  frontend:
    image: ${COMPOSE_PROJECT_NAME}-frontend
    build:
      context: ./frontend
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${COMPOSE_PROJECT_NAME}-api
    build:
      context: ./backend
    env_file:
      - env/${APP_ENV}.env
    networks:
      - internal
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  worker:
    image: ${COMPOSE_PROJECT_NAME}-api
    build:
      context: ./backend
    command: ["sh", "-c", "rq worker --url \"$$REDIS_URL\" default"]
    env_file:
      - env/${APP_ENV}.env
    networks:
      - internal
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "rq info --url \"$$REDIS_URL\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$MONGO_INITDB_ROOT_USERNAME\" ]; then mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\"; else mongosh --quiet --eval \"db.adminCommand('ping')\"; fi",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  internal:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
